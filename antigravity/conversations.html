<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conversations</title><style>
*{box-sizing:border-box}body{margin:0;padding:14px;background:#17191e;color:#eee;font:16px system-ui}main{max-width:800px;margin:auto}header{display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:24px}a{color:#9bc9ff}button,input{font:inherit;border:1px solid #667085;border-radius:8px;padding:10px;min-height:44px}button{background:#303949;color:white}button:disabled{opacity:.5}input{width:100%;background:#22252d;color:white;margin:12px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #434956;padding:14px 0}.info{min-width:0;overflow-wrap:anywhere;flex:1}.meta{color:#b7bfce;font-size:14px;margin-top:5px}p{line-height:1.5}.delete{border-color:#e69797}#status{color:#b9d9ff;min-height:24px}dialog{width:min(94vw,550px);border:1px solid #667085;border-radius:10px;background:#22252d;color:white}dialog::backdrop{background:#000a}.actions{display:flex;gap:10px;flex-wrap:wrap}#selected{overflow-wrap:anywhere}
</style><main><header><h1>Conversations</h1><a href="controls">Terminal</a></header>
<p>To delete or undo: enter <code>/exit</code> in the CLI, leave the add-on running, then refresh here. Restart the add-on when finished.</p>
<p>Delete removes a chat from local history and keeps an Undo backup. Workspace files and artifacts stay in place.</p>
<button id="refresh">Refresh</button><p id="status" role="status" aria-live="polite"></p>
<label for="search">Search conversations</label><input id="search" type="search" placeholder="Title or conversation ID" autocomplete="off">
<div id="list"></div><details><summary>Deleted conversations / Undo</summary><div id="trash"></div></details>
<dialog id="confirm" aria-labelledby="confirmTitle"><h2 id="confirmTitle"></h2><p id="selected"></p><p id="explain"></p><p id="error" role="alert"></p><div class="actions"><button id="apply"></button><button id="cancel">Cancel</button></div></dialog></main>
<script>
const csrf='__CSRF__';let data={items:[],trash:[],running:true},pending=null,busy=false;
const $=id=>document.getElementById(id),modal=$('confirm');
function setBusy(value){busy=value;document.querySelectorAll('button').forEach(b=>b.disabled=value||b.dataset.blocked==='true');}
function row(item,deleted){
 const el=document.createElement('div');el.className='row';const info=document.createElement('div');info.className='info';
 const title=document.createElement('strong');title.textContent=item.title;info.append(title);
 const meta=document.createElement('div');meta.className='meta';meta.textContent=deleted?'Saved for recovery':`${item.steps??0} steps · ${item.modified||'Date unavailable'}`;info.append(meta);
 const id=document.createElement('div');id.className='meta';id.textContent=item.id;info.append(id);
 const reason=item.blocked||(data.running?'Exit the CLI to delete or restore.':'');
 if(reason){const note=document.createElement('div');note.className='meta';note.textContent=reason;info.append(note);}
 const button=document.createElement('button');button.textContent=deleted?'Undo':'Delete';button.className=deleted?'':'delete';button.dataset.blocked=String(Boolean(reason));button.disabled=Boolean(reason)||busy;
 button.onclick=()=>{pending=deleted?{action:'restore',backup:item.backup,confirm:true}:{action:'delete',id:item.id,confirm:true};$('confirmTitle').textContent=deleted?'Restore conversation?':'Delete from history?';$('selected').textContent=item.title+' — '+item.id;$('explain').textContent=deleted?'Restore this conversation to local CLI history.':'Keep an Undo backup and remove this conversation from local CLI history. Workspace files and artifacts remain.';$('apply').textContent=deleted?'Restore':'Delete';$('error').textContent='';modal.showModal();};
 el.append(info,button);return el;
}
function render(){
 const query=$('search').value.toLocaleLowerCase();$('list').replaceChildren();$('trash').replaceChildren();
 const filtered=data.items.filter(i=>(i.title+' '+i.id).toLocaleLowerCase().includes(query));
 for(const item of filtered)$('list').append(row(item,false));
 if(!filtered.length)$('list').textContent='No matching conversations.';
 for(const item of data.trash)$('trash').append(row(item,true));
 if(!data.trash.length)$('trash').textContent='No deleted conversations available to restore.';
}
async function refresh(){
 const r=await fetch('conversation-list',{cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d.error||'Could not read history');data=d;render();
 $('status').textContent=`${d.items.length} conversations (up to ${d.limit}). `+(d.running?'CLI running — viewing only.':'CLI stopped — deletion and Undo available.');
}
async function load(){setBusy(true);try{await refresh();}catch(e){$('status').textContent=e.message;}finally{setBusy(false);}}
$('refresh').onclick=load;$('search').oninput=render;$('cancel').onclick=()=>modal.close();
modal.addEventListener('cancel',e=>{if(busy)e.preventDefault();});
$('apply').onclick=async()=>{if(busy||!pending)return;setBusy(true);try{const r=await fetch('conversation-action',{method:'POST',headers:{'Content-Type':'application/json','X-Antigravity-CSRF':csrf},body:JSON.stringify(pending)}),d=await r.json();if(!r.ok)throw new Error(d.error||'History action failed');modal.close();pending=null;await refresh();}catch(e){$('error').textContent=e.message;$('status').textContent=e.message;}finally{setBusy(false);}};
load();
</script></html>
