name: Antigravity Remote
version: "0.10.24"
slug: antigravity_remote
description: Experimental Antigravity CLI host with a persistent setup terminal
arch:
  - aarch64
  - amd64
startup: application
boot: manual
init: false
stage: experimental
apparmor: true
devices:
  - /dev/net/tun
ingress: true
ingress_stream: true
ingress_port: 8099
ingress_entry: /conversations
panel_icon: mdi:console
panel_title: Antigravity Setup
panel_admin: true
timeout: 30
backup: cold
options:
  trusted_read_domains: []
schema:
  trusted_read_domains:
    - str
