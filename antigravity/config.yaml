name: Antigravity Remote
version: "0.1.21"
slug: antigravity_remote
description: Experimental Antigravity CLI host with a persistent setup terminal
arch:
  - aarch64
  - amd64
startup: application
boot: manual
init: false
stage: experimental
apparmor: true
ingress: true
ingress_port: 8099
ingress_entry: /controls
panel_icon: mdi:console
panel_title: Antigravity Setup
panel_admin: true
timeout: 30
backup: cold
options:
  permission_profile: chat
  trusted_read_domains: []
schema:
  permission_profile: list(chat|balanced|review)
  trusted_read_domains:
    - str
