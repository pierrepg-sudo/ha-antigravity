name: Antigravity Remote
version: "0.1.17"
slug: antigravity_remote
description: Experimental Antigravity CLI host with a persistent setup terminal
arch:
  - aarch64
  - amd64
startup: application
boot: manual
init: false
stage: experimental
ingress: true
ingress_port: 8099
ingress_entry: /controls
panel_icon: mdi:console
panel_title: Antigravity Setup
panel_admin: true
timeout: 30
backup: cold
options:
  permission_profile: balanced
schema:
  permission_profile: list(balanced|review)
