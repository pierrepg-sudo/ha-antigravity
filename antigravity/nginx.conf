worker_processes 1;
pid /run/antigravity-files/nginx.pid;
error_log stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    client_body_temp_path /run/antigravity-files/nginx-client;
    proxy_temp_path /run/antigravity-files/nginx-proxy;
    fastcgi_temp_path /run/antigravity-files/nginx-fastcgi;
    uwsgi_temp_path /run/antigravity-files/nginx-uwsgi;
    scgi_temp_path /run/antigravity-files/nginx-scgi;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 8099;
        allow 172.30.32.2;
        deny all;
        location ~ ^/(signin|controls|input|profile-status|conversations|conversation-list|conversation-delete)$ {
            client_max_body_size 12m;
            proxy_pass http://127.0.0.1:7682;
            proxy_buffering off;
        }
        location ~ ^/(files|file-list|file-preview|file-download|file-action)$ {
            client_max_body_size 12m;
            include /run/antigravity-files/proxy-key.conf;
            proxy_pass http://127.0.0.1:7683;
            proxy_buffering off;
        }
        location / {
            proxy_pass http://127.0.0.1:7681;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
            proxy_buffering off;
        }
    }
}
